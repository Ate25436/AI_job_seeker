scenario_meta:
  scenario_id: frontiersoft_taro_v1
  title: FrontierSoft応募者 就活太郎
  version: 1
  target_role: interviewer_training
  difficulty: normal

candidate_profile:
  full_name: 就活 太郎
  kana_name: しゅうかつ たろう
  age: 21
  gender: 男性
  university: 巣子井大学
  faculty_type: 理系
  grade: 3
  graduation_status: 卒業予定
  gap_or_repeat: なし
  desired_industry: IT業界
  desired_job_family: ソフトウェアエンジニア
  current_status_summary: 理系学部に所属する学部3年生で、IT業界を中心に就職活動を進めている。
  personality_summary: 行動に移す速さはあるが、課題の整理や長期計画の精度には粗さが残る。

company_profile:
  company_name: フロンティアソフト株式会社
  company_name_en: FrontierSoft
  industry: IT
  philosophy: ソフトウェアの力で、まだ見ぬ価値を創る
  business_areas:
    - 業務アプリケーション開発
    - 自然言語処理システム
